[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mendpilot"
version = "0.1.0"
description = "Multi-model Python code repair with local execution and optional Docker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "mini-swe-agent==2.4.6",
  "openai>=1.66",
  "litellm",
  "tiktoken>=0.9",
  "PyYAML>=6",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
eval = ["pyarrow", "transformers>=4.51,<5", "swebench==4.1.0", "docker"]
dev = ["pytest>=8", "httpx", "build"]

[project.scripts]
mendpilot = "mendpilot.cli:main"
mendpilot-web = "mendpilot.web.server:main"
mendpilot-bench = "mendpilot.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mendpilot = ["profiles/*.yaml", "web/static/*"]

[tool.setuptools.data-files]
"share/mendpilot/swebench-lite" = ["benchmarks/swebench-lite/split.json", "benchmarks/swebench-lite/split.sha256", "benchmarks/swebench-lite/protocol.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires Docker and a prepared MENDPILOT_TEST_IMAGE", "eval: requires evaluation dependencies"]
